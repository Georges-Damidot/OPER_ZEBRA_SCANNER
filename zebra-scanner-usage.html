<!DOCTYPE html>
<html lang="fr" data-theme="dark" data-theme-mode="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zebra Usage</title>
<script>
(function(){try{var m=localStorage.getItem("zsu_theme")||"system";if(["light","dark","system"].indexOf(m)<0)m="system";var r=m==="system"?(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):m;document.documentElement.setAttribute("data-theme",r);document.documentElement.setAttribute("data-theme-mode",m);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;500;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--font-display:'Fraunces',Georgia,serif;--font-body:'Inter Tight',system-ui,sans-serif;--font-mono:'JetBrains Mono','Courier New',monospace}
:root,html[data-theme="dark"]{
  --bg:#0e1015;--bg-soft:#161922;--bg-card:#1b1f2a;--bg-card-hi:#232838;
  --line:#2a3042;--line-soft:#1f2433;
  --ink:#e5e7ec;--ink-soft:#9ea3b3;--ink-faint:#5d6373;
  --accent:#f5a623;--accent-2:#f7c873;--on-accent:#0e1015;
  --good:#5cd494;--warn:#f5c343;--bad:#ef5e6f;--info:#6ec4ff;
  --overlay:rgba(0,0,0,0.8);--shadow-lg:0 20px 60px rgba(0,0,0,0.5);
  --glow-a:rgba(245,166,35,0.06);--glow-b:rgba(184,138,255,0.04);
  --accent-bg:rgba(245,166,35,0.10);--accent-bg-soft:rgba(245,166,35,0.04);--accent-br:rgba(245,166,35,0.45);
  --good-bg:rgba(92,212,148,0.15);--good-br:rgba(92,212,148,0.35);
  --warn-bg:rgba(245,195,67,0.15);--warn-br:rgba(245,195,67,0.40);
  --bad-bg:rgba(239,94,111,0.18);--bad-br:rgba(239,94,111,0.42);
  --track:#232838;
}
html[data-theme="light"]{
  --bg:#faf8f4;--bg-soft:#f2eee6;--bg-card:#ffffff;--bg-card-hi:#f1ece2;
  --line:#ddd5c7;--line-soft:#eae4d9;
  --ink:#1b1915;--ink-soft:#5a544a;--ink-faint:#8a8377;
  --accent:#b8730a;--accent-2:#8f5806;--on-accent:#ffffff;
  --good:#0f7a4c;--warn:#9a6b00;--bad:#c2334a;--info:#14639f;
  --overlay:rgba(40,33,22,0.42);--shadow-lg:0 18px 50px rgba(60,50,35,0.18);
  --glow-a:rgba(184,115,10,0.07);--glow-b:rgba(106,63,190,0.05);
  --accent-bg:rgba(184,115,10,0.10);--accent-bg-soft:rgba(184,115,10,0.05);--accent-br:rgba(184,115,10,0.45);
  --good-bg:rgba(15,122,76,0.12);--good-br:rgba(15,122,76,0.35);
  --warn-bg:rgba(154,107,0,0.14);--warn-br:rgba(154,107,0,0.38);
  --bad-bg:rgba(194,51,74,0.12);--bad-br:rgba(194,51,74,0.38);
  --track:#ece6da;
}
html{color-scheme:dark}html[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(ellipse 1200px 600px at 70% -10%,var(--glow-a),transparent 60%),radial-gradient(ellipse 800px 400px at 10% 110%,var(--glow-b),transparent 60%);pointer-events:none;z-index:0}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--bg-soft)}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::selection{background:var(--accent);color:var(--on-accent)}
.hidden{display:none !important}

/* ---- header ---- */
.app-header{position:relative;z-index:2;display:flex;align-items:baseline;justify-content:space-between;padding:26px 40px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--accent-bg-soft) 0%,transparent 100%);flex-wrap:wrap;gap:16px}
.brand{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.brand-mark{font-family:var(--font-display);font-weight:900;font-size:32px;letter-spacing:-0.02em;line-height:1;font-variation-settings:"opsz" 144}
.brand-mark .accent{color:var(--accent);font-style:italic}
.brand-meta{font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-faint);border-left:1px solid var(--line);padding-left:18px}
.brand-meta strong{color:var(--accent-2);font-weight:500}
.header-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:20px;background:var(--bg-card)}
.seg-btn{font-family:var(--font-mono);font-size:11px;line-height:1;letter-spacing:0.04em;padding:6px 10px;border:none;background:transparent;color:var(--ink-faint);border-radius:16px;cursor:pointer;transition:all .15s ease;white-space:nowrap}
.seg-btn:hover{color:var(--ink);background:var(--bg-card-hi)}
.seg-btn.active{background:var(--accent);color:var(--on-accent);font-weight:700}
.status-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--bg-card);color:var(--ink-soft);font-family:var(--font-mono);font-size:12px;cursor:pointer;max-width:380px}
.status-pill span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);flex:none}
.status-pill.live .status-dot{background:var(--good);animation:pulse 2s infinite}
.status-pill.live{color:var(--good);border-color:var(--good-br)}
.status-pill.warn .status-dot{background:var(--warn)}.status-pill.warn{color:var(--warn);border-color:var(--warn-br)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(92,212,148,0.5)}50%{box-shadow:0 0 0 5px rgba(92,212,148,0)}}

/* ---- buttons ---- */
.btn{font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;padding:9px 16px;border:1px solid var(--line);background:var(--bg-card);color:var(--ink);border-radius:6px;cursor:pointer;transition:all 0.15s ease;white-space:nowrap}
.btn:hover{background:var(--bg-card-hi);border-color:var(--accent)}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-ghost{background:transparent;color:var(--ink-soft)}
.btn-danger{color:var(--bad)}.btn-danger:hover{border-color:var(--bad-br);background:var(--bad-bg)}
.btn-sm{padding:6px 10px;font-size:10px}

/* ---- layout ---- */
main{position:relative;z-index:2;padding:0 40px 60px}
.section{margin-top:30px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px;flex-wrap:wrap;gap:12px}
.section-title{font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-0.02em;margin:0}
.section-meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);letter-spacing:0.08em;text-transform:uppercase}
.section-help{color:var(--ink-soft);font-size:13px;margin:-6px 0 14px;max-width:80ch}
.panel{background:var(--bg-card);border:1px solid var(--line);border-radius:10px;overflow:hidden}

/* ---- drop zone ---- */
.drop{margin-top:34px;border:1.5px dashed var(--line);border-radius:12px;background:linear-gradient(180deg,var(--bg-soft) 0%,transparent 100%);padding:56px 24px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-bg-soft)}
.drop .big{font-family:var(--font-display);font-size:28px;font-weight:600;font-style:italic;letter-spacing:-0.01em}
.drop .sub{color:var(--ink-soft);margin:8px auto 18px;max-width:60ch}
.drop .files{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-top:16px}
.drop-mini{display:inline-flex}
body.dragging::after{content:attr(data-drop);position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:14px;background:var(--overlay);color:var(--accent);font-family:var(--font-display);font-size:30px;font-style:italic;display:flex;align-items:center;justify-content:center;z-index:3000;pointer-events:none}

/* ---- KPIs ---- */
.kpis{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px;margin-top:26px}
@media (max-width:1000px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--bg-card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:relative}
.kpi.hero{border-color:var(--accent-br);background:linear-gradient(135deg,var(--accent-bg) 0%,var(--bg-card) 70%)}
.kpi .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-faint)}
.kpi .val{font-family:var(--font-display);font-size:38px;font-weight:700;line-height:1.1;letter-spacing:-0.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:17px;color:var(--ink-soft);font-weight:400;margin-left:6px}
.kpi .sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.kpi.clickable{cursor:pointer}.kpi.clickable:hover{border-color:var(--accent)}
.gauge{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:10px}
.gauge i{display:block;height:100%;background:var(--accent);border-radius:4px}
.delta{font-family:var(--font-mono);font-size:11px;padding:1px 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
.delta.up{background:var(--bad-bg);color:var(--bad)}.delta.down{background:var(--good-bg);color:var(--good)}.delta.eq{background:rgba(127,127,127,.15);color:var(--ink-soft)}

/* ---- sites ---- */
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--bg-soft)}
.toolbar .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-faint);margin:0 2px 0 6px}
.toolbar .spacer{flex:1}
.sites{padding:6px 0}
.site-row{display:grid;grid-template-columns:200px 1fr 150px 70px;align-items:center;gap:14px;padding:7px 16px;cursor:pointer;border-left:3px solid transparent}
.site-row:hover{background:var(--bg-card-hi)}
.site-row.sel{background:var(--accent-bg);border-left-color:var(--accent)}
.site-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-name .cc{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);margin-right:6px;font-weight:500}
.bar{height:14px;background:var(--track);border-radius:3px;position:relative;overflow:hidden}
.bar .tot{position:absolute;left:0;top:0;bottom:0;background:var(--line);border-radius:3px}
.bar .low{position:absolute;left:0;top:0;bottom:0;border-radius:3px 0 0 3px}
.lv-good{background:var(--good)}.lv-warn{background:var(--warn)}.lv-bad{background:var(--bad)}
.tx-good{color:var(--good)}.tx-warn{color:var(--warn)}.tx-bad{color:var(--bad)}
.site-num{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);text-align:right;white-space:nowrap}
.site-num b{color:var(--ink);font-weight:700}
.site-pct{font-family:var(--font-mono);font-size:13px;font-weight:700;text-align:right}
.legend{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
@media (max-width:760px){.site-row{grid-template-columns:120px 1fr 54px}.site-num{display:none}}

/* ---- filters / table ---- */
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--bg-soft)}
@media (max-width:1000px){.filters{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-faint)}
.field input,.field select{background:var(--bg-card);border:1px solid var(--line);color:var(--ink);font-family:var(--font-body);font-size:13.5px;padding:7px 10px;border-radius:5px;outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;padding:4px 6px 4px 10px;border-radius:14px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-br)}
.chip button{border:none;background:transparent;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0 4px}
.chips .count{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-right:6px}
.table-wrap{overflow-x:auto;max-height:70vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--bg-card);z-index:1;text-align:left;font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--ink)}
thead th.sorted{color:var(--accent)}
thead th .arr{margin-left:4px}
th.num,td.num{text-align:right}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--bg-card-hi)}
tbody tr.row.open td{background:var(--accent-bg-soft)}
td.mono{font-family:var(--font-mono);font-size:12px;white-space:nowrap}
td .cmt{color:var(--ink-soft);max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr.detail td{background:var(--bg-soft);padding:12px 16px 14px 24px}
tr.detail pre{margin:0;font-family:var(--font-mono);font-size:12px;white-space:pre-wrap;color:var(--ink-soft);line-height:1.6}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:0.04em;font-family:var(--font-mono);white-space:nowrap}
.badge-good{background:var(--good-bg);color:var(--good)}.badge-warn{background:var(--warn-bg);color:var(--warn)}.badge-bad{background:var(--bad-bg);color:var(--bad)}.badge-neutral{background:rgba(127,127,127,.15);color:var(--ink-soft)}.badge-accent{background:var(--accent-bg);color:var(--accent)}
.txbar{display:inline-block;width:56px;height:6px;background:var(--track);border-radius:3px;margin-right:8px;vertical-align:middle;overflow:hidden}
.txbar i{display:block;height:100%;background:var(--info)}
.ago{color:var(--ink-faint);font-size:11px;margin-left:6px}
.empty{text-align:center;padding:40px 20px;color:var(--ink-faint);font-family:var(--font-mono);font-size:12px}
.table-foot{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--bg-soft);align-items:center;flex-wrap:wrap}
.table-foot .hint{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-left:auto}

/* ---- v5 improvements ---- */
@media (min-width:1100px){.app-header{flex-wrap:nowrap;align-items:center}.brand{flex-wrap:nowrap;min-width:0}.brand-meta{white-space:nowrap}.header-tools{flex-wrap:nowrap}.status-pill{max-width:300px}}
.header-tools .btn{padding:8px 12px}
.btn-icon{width:34px;padding:8px 0 !important;text-align:center;font-weight:700}
.mini-search{background:var(--bg-card);border:1px solid var(--line);color:var(--ink);font-family:var(--font-body);font-size:13px;padding:6px 10px;border-radius:5px;outline:none;width:220px;margin-left:8px}
.mini-search:focus{border-color:var(--accent)}
.sites-more{display:block;width:100%;border:none;border-top:1px dashed var(--line);background:transparent;color:var(--accent);font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:10px;cursor:pointer}
.sites-more:hover{background:var(--accent-bg-soft)}
.site-row .chk{width:14px;height:14px;border:1.5px solid var(--line);border-radius:3px;display:inline-block;margin-right:8px;vertical-align:-2px;flex:none}
.site-row.sel .chk{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--bg-card)}
mark{background:var(--accent-bg);color:var(--accent);border-radius:2px;padding:0 1px;outline:1px solid var(--accent-br)}
.ago.warn{color:var(--warn)}.ago.bad{color:var(--bad)}
.kbd{font-family:var(--font-mono);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--ink-faint)}
.filters .field .field-label .kbd{margin-left:6px}
.filters input[list]::-webkit-calendar-picker-indicator{opacity:.5}

/* ---- asset selection ---- */
th.selcell,td.selcell{width:34px;padding-right:0;cursor:default}
.selcell input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;vertical-align:middle;margin:0}
tbody tr.row.picked td{background:var(--accent-bg)}
tbody tr.row.picked td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.sel-info{font-family:var(--font-mono);font-size:11px;color:var(--accent);padding:4px 10px;border:1px solid var(--accent-br);border-radius:14px;background:var(--accent-bg)}
#btnOnlySel.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}

/* ---- backup ---- */
#btnBackup{position:relative;display:inline-flex;align-items:center;gap:7px}
.bk-dot{width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.drop #btnRestore{margin-left:6px}
#bkInfo{line-height:1.7}
#bkInfo b{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--ink)}

/* ---- donuts ---- */
.pies{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:16px;border-bottom:1px solid var(--line)}
@media (max-width:1200px){.pies{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.pies{grid-template-columns:1fr}}
.pie{background:var(--bg-soft);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pie h4{margin:0;font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-0.01em}
.pie-body{display:flex;gap:14px;align-items:center}
.pie svg{width:112px;height:112px;flex:none;overflow:visible}
.pie svg path{cursor:pointer;transition:opacity .15s,transform .15s;transform-origin:60px 60px}
.pie svg path:hover{transform:scale(1.05)}
.pie svg path.dim{opacity:.25}
.pie .c-num{font-family:var(--font-display);font-size:22px;font-weight:700;fill:var(--ink)}
.pie .c-lbl{font-family:var(--font-mono);font-size:8px;letter-spacing:.08em;fill:var(--ink-faint);text-transform:uppercase}
.pie ul{list-style:none;margin:0;padding:0;font-size:12px;min-width:0;flex:1}
.pie li{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:4px;cursor:pointer;white-space:nowrap}
.pie li:hover{background:var(--bg-card-hi)}
.pie li.on{background:var(--accent-bg);color:var(--accent)}
.pie li i{width:9px;height:9px;border-radius:2px;flex:none}
.pie li span{overflow:hidden;text-overflow:ellipsis;flex:1}
.pie li b{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--ink-soft)}

/* ---- history ---- */
.hist-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:start}
@media (max-width:1000px){.hist-grid{grid-template-columns:1fr}}
.spark{padding:16px}
.spark svg{width:100%;height:160px;display:block}
.out-list{padding:12px 16px;font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);line-height:1.8}

/* ---- modal / toast / footer ---- */
dialog{background:var(--bg-card);color:var(--ink);border:2px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:0;max-width:580px;width:calc(100% - 40px)}
dialog::backdrop{background:var(--overlay);backdrop-filter:blur(4px)}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{margin:0;font-family:var(--font-display);font-size:18px;font-weight:600}
.modal-close{background:none;border:none;color:var(--ink-faint);font-size:22px;cursor:pointer;padding:2px 6px;border-radius:4px}
.modal-body{padding:18px 22px 22px}
.modal-body p{margin:8px 0;font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.modal-body p b{color:var(--ink)}
.modal-body .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.file-block{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--bg-soft);font-size:13px}
.file-block .t{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
.file-block code{font-family:var(--font-mono);font-size:12px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;font-family:var(--font-mono);font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2000;box-shadow:var(--shadow-lg);max-width:90vw}
#toast.show{opacity:1}
.app-footer{position:relative;z-index:2;padding:22px 40px;border-top:1px solid var(--line);margin-top:30px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media (max-width:760px){.app-header,main,.app-footer{padding-left:16px;padding-right:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media print{body::before,.header-tools,.toolbar,.filters,.table-foot,#dropMini{display:none !important}.table-wrap{max-height:none}}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="brand-mark">Zebra<span class="accent">Usage</span></div>
    <div class="brand-meta" data-i18n="brand_meta"></div>
  </div>
  <div class="header-tools">
    <div class="seg" id="langSeg" role="group" aria-label="Langue / Language">
      <button type="button" class="seg-btn" data-lang="fr" title="Français">FR</button>
      <button type="button" class="seg-btn" data-lang="en" title="English">EN</button>
    </div>
    <div class="seg" id="themeSeg" role="group">
      <button type="button" class="seg-btn" data-theme-set="light" data-i18n-title="th_light">☀</button>
      <button type="button" class="seg-btn" data-theme-set="dark" data-i18n-title="th_dark">☾</button>
      <button type="button" class="seg-btn" data-theme-set="system" data-i18n-title="th_system">🖵</button>
    </div>
    <button class="btn btn-ghost btn-icon" id="btnHelp" data-i18n-title="help_title">?</button>
    <button class="btn" id="btnBackup"><span class="bk-dot hidden" id="bkDot"></span><span data-i18n="bk_btn"></span></button>
    <button class="btn drop-mini hidden" id="dropMini" data-i18n="load_btn"></button>
    <span class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusText"></span></span>
  </div>
</header>

<main>
  <!-- ===== EMPTY STATE ===== -->
  <section id="viewEmpty">
    <div class="drop" id="drop">
      <div class="big" data-i18n="drop_big"></div>
      <div class="sub" data-i18n="drop_sub"></div>
      <button class="btn btn-primary" id="btnPick" data-i18n="pick_btn"></button>
      <button class="btn" id="btnRestore" data-i18n="bk_restore_btn"></button>
      <div class="files">ZEBRA_Scanner_Usage_*.zip · asset_details.csv · assets_per_site.csv · low_usage_assets_repartition.csv</div>
    </div>
  </section>

  <!-- ===== DASHBOARD ===== -->
  <section id="viewDash" class="hidden">
    <div class="kpis" id="kpis"></div>

    <div class="section">
      <div class="section-head"><h2 class="section-title" data-i18n="sites_title"></h2><span class="section-meta" id="sitesMeta"></span></div>
      <p class="section-help" data-i18n="sites_help2"></p>
      <div class="panel">
        <div class="toolbar">
          <span class="lbl" data-i18n="sort_by"></span>
          <div class="seg" id="siteSort">
            <button class="seg-btn active" data-s="pct" data-i18n="sort_pct"></button>
            <button class="seg-btn" data-s="low" data-i18n="sort_low"></button>
            <button class="seg-btn" data-s="total" data-i18n="sort_total"></button>
            <button class="seg-btn" data-s="name" data-i18n="sort_name"></button>
          </div>
          <input type="search" id="sSiteQ" class="mini-search" data-i18n-ph="ph_site" autocomplete="off">
          <span class="spacer"></span>
          <button class="btn btn-sm btn-ghost hidden" id="sitesClear" data-i18n="sites_clear"></button>
          <label class="lbl" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="hideZero" style="accent-color:var(--accent)"> <span data-i18n="hide_zero"></span></label>
        </div>
        <div class="sites" id="sites"></div>
        <button class="sites-more hidden" id="sitesMore"></button>
        <div class="legend"><span><i class="lv-good"></i><span data-i18n="leg_good"></span></span><span><i class="lv-warn"></i><span data-i18n="leg_warn"></span></span><span><i class="lv-bad"></i><span data-i18n="leg_bad"></span></span><span><i style="background:var(--line)"></i><span data-i18n="leg_tot"></span></span></div>
      </div>
    </div>

    <div class="section" id="secAssets">
      <div class="section-head"><h2 class="section-title" data-i18n="assets_title"></h2><span class="section-meta" id="assetsMeta"></span></div>
      <div class="panel">
        <div class="filters">
          <div class="field"><span class="field-label"><span data-i18n="f_search"></span><span class="kbd" title="/">/</span></span><input type="search" id="fQ" data-i18n-ph="ph_search"></div>
          <div class="field"><span class="field-label" data-i18n="f_country"></span><select id="fCountry"></select></div>
          <div class="field"><span class="field-label" data-i18n="f_site"></span><input type="search" id="fSiteQ" list="siteList" data-i18n-ph="ph_site" autocomplete="off"><datalist id="siteList"></datalist></div>
          <div class="field"><span class="field-label" data-i18n="f_model"></span><select id="fModel"></select></div>
          <div class="field"><span class="field-label" data-i18n="f_act"></span><select id="fAct">
            <option value="" data-i18n="act_all"></option>
            <option value="never" data-i18n="act_never"></option>
            <option value="zero" data-i18n="act_zero"></option>
            <option value="lt50" data-i18n="act_lt50"></option>
            <option value="ge50" data-i18n="act_ge50"></option>
          </select></div>
        </div>
        <div class="toolbar">
          <span class="lbl" data-i18n="f_state"></span>
          <div class="seg" id="fState">
            <button class="seg-btn active" data-v="" data-i18n="all"></button>
            <button class="seg-btn" data-v="EN SERVICE" data-i18n="in_service"></button>
            <button class="seg-btn" data-v="EN STOCK" data-i18n="in_stock"></button>
          </div>
          <span class="lbl" id="newLbl" data-i18n="f_evol"></span>
          <div class="seg" id="fNew">
            <button class="seg-btn active" data-v="" data-i18n="all"></button>
            <button class="seg-btn" data-v="new" data-i18n="new_week"></button>
          </div>
          <span class="spacer"></span>
          <button class="btn btn-sm btn-ghost" id="btnReset" data-i18n="reset"></button>
        </div>
        <div class="chips" id="chips"></div>
        <div class="pies" id="pies"></div>
        <div class="table-wrap">
          <table>
            <thead><tr id="thead"></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="table-foot">
          <button class="btn btn-primary" id="btnExport"></button>
          <button class="btn" id="btnCopy"></button>
          <span class="sel-info hidden" id="selInfo"></span>
          <button class="btn btn-sm hidden" id="btnOnlySel"></button>
          <button class="btn btn-sm btn-ghost hidden" id="btnClearSel" data-i18n="sel_clear"></button>
          <span class="hint" data-i18n="row_hint2"></span>
        </div>
      </div>
    </div>

    <div class="section" id="secHist">
      <div class="section-head"><h2 class="section-title" data-i18n="hist_title"></h2><span class="section-meta" id="histMeta"></span></div>
      <p class="section-help" data-i18n="hist_help"></p>
      <div class="hist-grid">
        <div class="panel"><div class="spark" id="spark"></div></div>
        <div class="panel">
          <div class="table-wrap" style="max-height:340px">
            <table><thead><tr><th data-i18n="h_extract"></th><th class="num" data-i18n="h_fleet"></th><th class="num" data-i18n="h_low"></th><th class="num" data-i18n="h_rate"></th><th></th></tr></thead><tbody id="histBody"></tbody></table>
          </div>
        </div>
      </div>
      <div class="panel hidden" id="outPanel" style="margin-top:20px">
        <div class="toolbar"><span class="lbl" data-i18n="out_title"></span></div>
        <div class="out-list" id="outList"></div>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>
<input type="file" id="jsonInput" accept=".json,application/json" hidden>
<input type="file" id="fileInput" accept=".zip,.csv,.json,text/csv,application/zip,application/json" multiple hidden>

<dialog id="dlgBackup">
  <div class="modal-header"><h3 data-i18n="bk_title"></h3><button class="modal-close" data-close="dlgBackup">×</button></div>
  <div class="modal-body">
    <p data-i18n="bk_intro"></p>
    <div class="file-block"><div class="t" data-i18n="bk_state"></div><div id="bkInfo"></div></div>
    <div class="row">
      <button class="btn" id="bkImport" data-i18n="bk_import"></button>
      <button class="btn btn-primary" id="bkExport" data-i18n="bk_export"></button>
    </div>
  </div>
</dialog>

<dialog id="dlgHelp">
  <div class="modal-header"><h3 data-i18n="help_title"></h3><button class="modal-close" data-close="dlgHelp">×</button></div>
  <div class="modal-body" data-i18n="help_body"></div>
</dialog>

<script>
/* ---------- i18n ---------- */

  sort_by:'Trier par', sort_pct:'% sous-utilisé', sort_low:'Nb sous-utilisés', sort_total:'Taille du parc', sort_name:'Nom',

  f_state:'État', all:'Tous', in_service:'En service', in_stock:'En stock', f_evol:'Évolution', new_week:'Nouveaux cette semaine',
  reset:'Réinitialiser les filtres', export:'Exporter la sélection (.csv)', copy:'Copier les codes asset', row_hint:'Cliquez sur une ligne pour lire le commentaire complet',
  hist_title:'Semaine après semaine',
  hist_help:'Chaque extraction chargée est mémorisée dans ce navigateur (chiffres et codes asset uniquement) pour comparer avec la semaine précédente.',

  out_title:'Sortis de la liste depuis l\'extraction précédente',
  foot_left:'Zebra Usage · fichier unique, lecture locale', foot_drop:'Glissez une nouvelle extraction n\'importe où sur la page',
  help_title:'Comment ça marche',
  help_body:`<p><b>Charger.</b> Glissez le .zip hebdomadaire sur la page, ou « Charger une extraction ». Les trois CSV peuvent aussi être déposés directement (utile hors ligne, où l'ouverture du .zip n'est pas possible).</p>
    <div class="file-block"><div class="t">Fichiers reconnus (par leurs colonnes)</div>
      <code>assets_per_site.csv</code> — parc et sous-utilisés par site<br>
      <code>asset_details.csv</code> — un scanner sous-utilisé par ligne<br>
      <code>low_usage_assets_repartition.csv</code> — utilisé seulement si le premier manque</div>
    <p><b>Lire.</b> Les cartes du haut résument la semaine. Le classement des sites se trie par taux, volume ou taille de parc ; un clic sur un site filtre la liste des scanners. Une carte chiffrée cliquable applique aussi le filtre correspondant.</p>
    <p><b>Filtrer.</b> Recherche libre (code, commentaire, site, modèle), pays, site, modèle, activité, état. Les camemberts suivent la sélection en cours ; un clic sur une part (ou sa légende) filtre dessus, un second clic retire le filtre. Les colonnes du tableau se trient d'un clic. « Exporter la sélection » produit un CSV au format Excel (séparateur point-virgule), avec les en-têtes dans la langue affichée.</p>
    <p><b>Comparer.</b> À partir de la deuxième extraction, les écarts avec la semaine précédente apparaissent sur les cartes et les sites, les nouveaux scanners sont marqués « nouveau », et ceux sortis de la liste sont listés en bas. L'historique reste dans ce navigateur ; « Oublier » retire une semaine.</p>
    <p><b>Date d'extraction.</b> Lue dans le nom du .zip (<code>…_2026-10-07T0906.zip</code>), sinon la date du fichier.</p>
    <p><b>Sauvegarde.</b> Le bouton « Sauvegarde » exporte l'historique et la dernière extraction dans un .json, à ranger par exemple sur le sharedrive. Pour restaurer : « Importer un .json… » ou glisser le .json sur la page. Un point orange signale une extraction pas encore sauvegardée.</p>
    <p><b>Langue.</b> Le sélecteur FR / EN en haut à droite bascule toute l'interface ; le choix est mémorisé.</p>`,

  st_service:'en service', st_stock:'en stock',

  t_nocopy:'Aucun code à copier.', t_copied:n=>n+' code(s) asset copié(s).',

  sel_only:'Voir uniquement la sélection', sel_all_rows:'Voir tous les scanners', sel_head:'Tout cocher / décocher (lignes affichées) · Maj+clic pour une plage',
  row_hint2:'Cochez des scanners pour les exporter · clic sur une ligne pour le commentaire',
  bk_btn:'Sauvegarde', bk_restore_btn:'Restaurer une sauvegarde (.json)', bk_title:'Sauvegarde des données',
  bk_intro:'Les extractions et l\'historique sont gardés dans le stockage du navigateur, qui peut être vidé (nettoyage des cookies, changement de poste…). Exportez un fichier <b>.json</b> pour les conserver, puis réimportez-le au besoin : il est fusionné avec ce qui est déjà présent, rien n\'est écrasé.',
  bk_state:'État actuel', bk_export:'Exporter (.json)', bk_import:'Importer un .json…',
  bk_info:(n,last,bk)=>`Historique : <b>${n}</b> semaine${n>1?'s':''}<br>Extraction affichée : <b>${last}</b><br>Dernière sauvegarde : <b>${bk}</b>`,

},
en:{
  brand_meta:'Under-used scanners · <strong>Weekly extract</strong><br>Zebra device fleet',
  th_light:'Light theme', th_dark:'Dark theme', th_system:'Follow system',
  help_btn:'? Help', load_btn:'Load', no_extract:'No extract loaded',

  f_state:'Status', all:'All', in_service:'In service', in_stock:'In stock', f_evol:'Change', new_week:'New this week',
  reset:'Reset filters', export:'Export selection (.csv)', copy:'Copy asset codes', row_hint:'Click a row to read the full comment',
  hist_title:'Week over week',
  hist_help:'Each loaded extract is kept in this browser (figures and asset codes only) to compare with the previous week.',
  h_extract:'Extract', h_fleet:'Fleet', h_low:'Under-used', h_rate:'Rate',
  out_title:'Removed from the list since the previous extract',
  foot_left:'Zebra Usage · single file, read locally', foot_drop:'Drop a new extract anywhere on the page',
  help_title:'How it works',
  help_body:`<p><b>Load.</b> Drag the weekly .zip onto the page, or use “Load an extract”. The three CSVs can also be dropped directly (useful offline, where the .zip can't be opened).</p>
    <div class="file-block"><div class="t">Recognised files (by their columns)</div>
      <code>assets_per_site.csv</code> — fleet and under-used count per site<br>
      <code>asset_details.csv</code> — one under-used scanner per row<br>
      <code>low_usage_assets_repartition.csv</code> — used only if the first one is missing</div>
    <p><b>Read.</b> The top cards sum up the week. The site ranking sorts by rate, count or fleet size; clicking a site filters the scanner list. Clickable cards apply the matching filter too.</p>
    <p><b>Filter.</b> Free search (code, comment, site, model), country, site, model, activity, status. The donut charts follow the current selection; click a slice (or its legend) to filter on it, click again to clear. Table columns sort with a click. “Export selection” produces an Excel-friendly CSV (semicolon separator), with headers in the displayed language.</p>

/* ---------- CSV ---------- */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/,1)[0]; const d=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[]; let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===d){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  const head=(rows.shift()||[]).map(h=>h.trim());
  return {head, rows:rows.filter(r=>r.some(v=>v.trim()!=='')).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])))};
}
function kindOf(head){
  if(head.includes('Asset Code')) return 'details';
  if(head.includes('Number of Assets')) return 'sites';
  if(head.includes('Count Asset Code Low Transactions')) return 'repartition';
  return null;
}

      }catch(e){ toast(t('t_badzip',e.message)); return; }

function syncSegs(){
  document.querySelectorAll('#fState .seg-btn').forEach(b=>b.classList.toggle('active',b.dataset.v===F.state));
  document.querySelectorAll('#fNew .seg-btn').forEach(b=>b.classList.toggle('active',b.dataset.v===F.onlyNew));
  document.querySelectorAll('#siteSort .seg-btn').forEach(b=>b.classList.toggle('active',b.dataset.s===siteSort));
}
function filtered(){
  const q=F.q.toLowerCase().trim();
  return D.assets.filter(a=>{
    if(F.country&&a.cc!==F.country) return false;
    if(F.sites.length&&!F.sites.includes(a.site)) return false;
    if(F.siteQ&&!siteMatch(a.site,F.siteQ)) return false;
    if(F.model&&a.model!==F.model) return false;
    if(F.state&&a.state!==F.state) return false;
    if(F.onlyNew&&!a.isNew) return false;
    if(onlySel&&!SEL.has(a.code)) return false;
    if(F.act==='never'&&a.last) return false;
    if(F.act==='zero'&&a.tx!==0) return false;
    if(F.act==='lt50'&&!(a.tx>0&&a.tx<50)) return false;
    if(F.act==='ge50'&&a.tx<50) return false;
    if(q&&!(a.code+' '+a.site+' '+a.model+' '+a.comment+' '+a.state+' '+stateLbl(a.state)).toLowerCase().includes(q)) return false;
    return true;
  });
}
function sorted(list){
  const k=sort.k, d=sort.dir;
  return [...list].sort((a,b)=>{
    let x=a[k], y=b[k];
    if(k==='last'){ x=a.last||'0000'; y=b.last||'0000'; }
    if(typeof x==='number') return (x-y)*d||a.code.localeCompare(b.code);
    return String(x).localeCompare(String(y),LANG)*d||a.code.localeCompare(b.code);
  });
}
function renderHead(list){
  const vis=list.map(a=>a.code), nSel=vis.filter(c=>SEL.has(c)).length;
  $('#thead').innerHTML=`<th class="selcell" title="${t('sel_head')}"><input type="checkbox" id="chkAll" ${vis.length&&nSel===vis.length?'checked':''}></th>`+COLS.map(c=>`<th class="${c.num?'num':''} ${sort.k===c.k?'sorted':''}" data-k="${c.k}">${t('c_'+c.k)}${sort.k===c.k?`<span class="arr">${sort.dir>0?'▲':'▼'}</span>`:''}</th>`).join('');
  const ca=$('#chkAll'); ca.indeterminate=nSel>0&&nSel<vis.length;
  ca.onclick=e=>{ e.stopPropagation(); const on=nSel<vis.length; vis.forEach(c=>on?SEL.add(c):SEL.delete(c)); if(!SEL.size) onlySel=false; renderAssets(); };
  document.querySelectorAll('#thead th[data-k]').forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(sort.k===k) sort.dir*=-1; else { sort.k=k; sort.dir=k==='last'?-1:1; } renderAssets(); });
}
function renderAssets(){
  const list=sorted(filtered()); renderHead(list); const maxTx=Math.max(1,...D.assets.map(a=>a.tx));
  $('#assetsMeta').textContent=t('assets_meta',list.length,D.assets.length);
  const rows=list.map(a=>{
    const stB=a.state==='EN STOCK'?'badge-neutral':a.state==='EN SERVICE'?'badge-accent':'badge-warn';
    const lastCell=a.last?`${fmtDate(a.ld)}<span class="ago ${a.ago>60?'bad':a.ago>30?'warn':''}" title="${t('ago_hint')}">${t('ago',a.ago)}</span>`:`<span class="badge badge-bad">${t('never')}</span>`;
    const short=(a.comment.split(/\n/).find(l=>l.trim())||'').trim();
    const multi=a.comment.trim().split(/\n+/).filter(l=>l.trim()).length>1;
    let html=`<tr class="row ${openRow===a.code?'open':''} ${SEL.has(a.code)?'picked':''}" data-code="${esc(a.code)}">
      <td class="selcell"><input type="checkbox" class="rowchk" data-code="${esc(a.code)}" ${SEL.has(a.code)?'checked':''}></td>
      <td class="mono">${hl(a.site,F.q||F.siteQ)}</td>
      <td class="mono"><b>${hl(a.code,F.q)}</b>${a.isNew?` <span class="badge badge-warn">${t('new_b')}</span>`:''}</td>
      <td class="mono">${a.model?hl(a.model,F.q):'—'}</td>
      <td><span class="badge ${stB}">${esc(stateLbl(a.state))}</span></td>
      <td class="mono">${lastCell}</td>
      <td class="num mono"><span class="txbar"><i style="width:${100*a.tx/maxTx}%"></i></span>${a.tx}</td>
      <td><div class="cmt">${hl(short,F.q)||'<span style="color:var(--ink-faint)">—</span>'}${multi?' <span class="badge badge-neutral">+</span>':''}</div></td></tr>`;
    if(openRow===a.code) html+=`<tr class="detail"><td colspan="8"><pre>${hl(a.comment.trim().replace(/\n{2,}/g,'\n'),F.q)||t('no_comment')}</pre></td></tr>`;
    return html;
  }).join('');
  $('#tbody').innerHTML=rows||`<tr><td colspan="8"><div class="empty">${t('no_match')}</div></td></tr>`;
  document.querySelectorAll('#tbody tr.row').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('.selcell')) return; openRow=openRow===tr.dataset.code?null:tr.dataset.code; renderAssets(); });
  const codes=list.map(a=>a.code);
  document.querySelectorAll('#tbody .selcell').forEach(td=>td.onclick=e=>{ if(e.target.tagName!=='INPUT'){ td.querySelector('input').click(); } });
  document.querySelectorAll('#tbody .rowchk').forEach(cb=>cb.onclick=e=>{
    e.stopPropagation(); const c=cb.dataset.code, on=cb.checked;
    if(e.shiftKey&&lastChk&&codes.includes(lastChk)){ const [i,j]=[codes.indexOf(lastChk),codes.indexOf(c)].sort((x,y)=>x-y); codes.slice(i,j+1).forEach(k=>on?SEL.add(k):SEL.delete(k)); }
    else on?SEL.add(c):SEL.delete(c);
    lastChk=c; if(!SEL.size) onlySel=false; renderAssets();
  });
  renderSelBar(list);
  renderChips(list.length);
  renderPies(list);
  saveView();
}
function renderChips(n){
  const c=[];
  const add=(k,l)=>c.push(`<span class="chip">${esc(l)}<button data-k="${k}" title="${t('remove')}">×</button></span>`);
  if(F.q) add('q','“'+F.q+'”'); if(F.country) add('country',countryName(F.country)); if(F.siteQ) add('siteQ',t('chip_siteq',F.siteQ)); F.sites.forEach(n=>add('site:'+n,n));
  if(F.model) add('model',F.model); if(F.act) add('act',t('act_'+F.act));
  if(F.state) add('state',stateLbl(F.state)); if(F.onlyNew) add('onlyNew',t('chip_new'));
  $('#chips').innerHTML=c.length?`<span class="count">${t('results',n)}</span>`+c.join(''):'';
  $('#chips').classList.toggle('hidden',!c.length);
  document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; if(k.startsWith('site:')) F.sites=F.sites.filter(n=>n!==k.slice(5)); else F[k]=''; syncFilterInputs(); renderSites(); renderAssets(); });
}
$('#fQ').oninput=e=>{ F.q=e.target.value; renderAssets(); };
$('#fCountry').onchange=e=>{ F.country=e.target.value; fillSiteSelect(); renderSites(); renderAssets(); };
$('#fModel').onchange=e=>{ F.model=e.target.value; renderAssets(); };
$('#fAct').onchange=e=>{ F.act=e.target.value; renderAssets(); };
document.querySelectorAll('#fState .seg-btn').forEach(b=>b.onclick=()=>{ F.state=b.dataset.v; syncSegs(); renderAssets(); });
document.querySelectorAll('#fNew .seg-btn').forEach(b=>b.onclick=()=>{ F.onlyNew=b.dataset.v; syncSegs(); renderAssets(); });
function resetFilters(render=true){ Object.keys(F).forEach(k=>F[k]=Array.isArray(F[k])?[]:''); openRow=null; if(render){ syncFilterInputs(); renderSites(); renderAssets(); } }
$('#btnReset').onclick=()=>resetFilters(true);

function selList(){ return sorted(D.assets.filter(a=>SEL.has(a.code))); }
function renderSelBar(list){
  const n=SEL.size, hidden=n?[...SEL].filter(c=>!list.some(a=>a.code===c)).length:0;
  $('#btnExport').textContent=n?t('export_sel',n):t('export_all',list.length);
  $('#btnCopy').textContent=n?t('copy_sel',n):t('copy_all');
  $('#selInfo').classList.toggle('hidden',!n); $('#selInfo').textContent=t('sel_info',n,onlySel?0:hidden);
  $('#btnClearSel').classList.toggle('hidden',!n);
  const bo=$('#btnOnlySel'); bo.classList.toggle('hidden',!n); bo.classList.toggle('on',onlySel); bo.textContent=onlySel?t('sel_all_rows'):t('sel_only');
}
$('#btnClearSel').onclick=()=>{ SEL.clear(); onlySel=false; lastChk=null; renderAssets(); };
$('#btnOnlySel').onclick=()=>{ onlySel=!onlySel; renderAssets(); };
$('#btnExport').onclick=()=>{
  const list=SEL.size?selList():sorted(filtered()); if(!list.length){ toast(t('t_noexport')); return; }
  const q=v=>{ v=String(v??''); return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=[t('x_head').join(';')].concat(list.map(a=>[a.site,countryName(a.cc),a.code,a.model,stateLbl(a.state),a.last,a.ago??'',a.tx,a.isNew?t('yes'):'',a.comment.trim()].map(q).join(';')));
  const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const el=document.createElement('a'); el.href=URL.createObjectURL(blob); el.download=`${t('x_file')}_${D.date}${SEL.size?'_selection':''}${!SEL.size&&F.sites.length===1?'_'+F.sites[0].replace(/[^\w-]+/g,'_'):''}.csv`; el.click(); setTimeout(()=>URL.revokeObjectURL(el.href),2000);
  toast(t('t_exported',list.length));
};
$('#btnCopy').onclick=async()=>{
  const codes=(SEL.size?selList():sorted(filtered())).map(a=>a.code).join('\n'); if(!codes){ toast(t('t_nocopy')); return; }
  try{ await navigator.clipboard.writeText(codes); }catch(e){ const ta=document.createElement('textarea'); ta.value=codes; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(t('t_copied',codes.split('\n').length));
};

/* ---------- donuts ---------- */
const PAL=['var(--accent)','var(--info)','var(--good)','#b88aff','var(--bad)','var(--warn)','#4fd1c5','var(--ink-faint)'];
function arc(cx,cy,r,ri,a0,a1){
  if(a1-a0>=Math.PI*2-1e-6) a1=a0+Math.PI*2-1e-4;
  const p=(a,rr)=>[cx+rr*Math.sin(a),cy-rr*Math.cos(a)], L=a1-a0>Math.PI?1:0;
  const [x0,y0]=p(a0,r),[x1,y1]=p(a1,r),[x2,y2]=p(a1,ri),[x3,y3]=p(a0,ri);
  return `M${x0} ${y0}A${r} ${r} 0 ${L} 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 ${L} 0 ${x3} ${y3}Z`;
}
function donut(title,data,filterKey,active){
  const tot=data.reduce((a,d)=>a+d.n,0); let a=0; const pc=n=>tot?pctInt(100*n/tot):'0';
  const segs=tot?data.map((d,i)=>{ const a0=a; a+=2*Math.PI*d.n/tot; return `<path d="${arc(60,60,56,36,a0,a)}" fill="${PAL[i%PAL.length]}" class="${active&&active!==d.v?'dim':''}" data-f="${filterKey}" data-v="${esc(d.v)}"><title>${esc(d.l)} : ${d.n} (${pc(d.n)})</title></path>`; }).join(''):`<circle cx="60" cy="60" r="46" fill="none" stroke="var(--line)" stroke-width="20"/>`;
  const legend=data.map((d,i)=>`<li class="${active===d.v?'on':''}" data-f="${filterKey}" data-v="${esc(d.v)}"><i style="background:${PAL[i%PAL.length]}"></i><span>${esc(d.l)}</span><b>${d.n} · ${pc(d.n)}</b></li>`).join('');
  return `<div class="pie"><h4>${title}</h4><div class="pie-body"><svg viewBox="0 0 120 120">${segs}<text x="60" y="64" text-anchor="middle" class="c-num">${tot}</text><text x="60" y="78" text-anchor="middle" class="c-lbl">${t('p_center')}</text></svg><ul>${legend}</ul></div></div>`;
}
function groupBy(list,fn,label,max=6){
  const m=new Map(); list.forEach(x=>{ const k=fn(x); m.set(k,(m.get(k)||0)+1); });
  let arr=[...m].map(([v,n])=>({v,n,l:label(v)})).sort((a,b)=>b.n-a.n);
  if(arr.length>max){ const rest=arr.slice(max-1); arr=arr.slice(0,max-1); arr.push({v:'__other',n:rest.reduce((a,x)=>a+x.n,0),l:t('others',rest.length)}); }
  return arr;
}
function actOf(a){ return !a.last?'never':a.tx===0?'zero':a.tx<50?'lt50':'ge50'; }
function renderPies(list){
  const act=['never','zero','lt50','ge50'].map(v=>({v,l:t('a_'+v),n:list.filter(a=>actOf(a)===v).length})).filter(d=>d.n);
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  $('#pies').innerHTML=
    donut(t('p_model'),groupBy(list,a=>a.model,v=>v||t('empty')),'model',F.model)+
    donut(t('p_state'),groupBy(list,a=>a.state,v=>cap(stateLbl(v))),'state',F.state)+
    donut(t('p_act'),act,'act',F.act)+
    donut(t('p_country'),groupBy(list,a=>a.cc,v=>countryName(v),8),'country',F.country);
  document.querySelectorAll('#pies [data-f]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.f, v=el.dataset.v; if(v==='__other'){ toast(t('t_other')); return; }
    F[k]=F[k]===v?'':v;
    syncFilterInputs(); renderSites(); renderAssets();
  });
}

/* ---------- history ---------- */
function renderHist(){
  const h=loadHist();
  $('#histMeta').textContent=t('hist_meta',h.length);
  $('#histBody').innerHTML=[...h].reverse().map(e=>{
    const r=e.total?100*e.low/e.total:null, cur=e.date===D.date;
    return `<tr style="${cur?'background:var(--accent-bg-soft)':''}"><td class="mono">${dDay(e.date)}${cur?` <span class="badge badge-accent">${t('shown')}</span>`:''}</td><td class="num mono">${e.total?fmtN(e.total):'—'}</td><td class="num mono">${fmtN(e.low)}</td><td class="num mono ${r!=null?'tx-'+lv(r):''}">${r!=null?pctTxt(r):'—'}</td><td class="num"><button class="btn btn-sm btn-ghost" data-forget="${e.date}">${t('forget')}</button></td></tr>`;
  }).join('');
  document.querySelectorAll('[data-forget]').forEach(b=>b.onclick=()=>{ saveHist(loadHist().filter(e=>e.date!==b.dataset.forget)); toast(t('t_forgot')); build(D.raw,false); });
  const pts=h.filter(e=>e.total).map(e=>({d:e.date,r:100*e.low/e.total,l:e.low}));
  if(pts.length<2){ $('#spark').innerHTML=`<div class="empty">${t('spark_empty')}</div>`; }
  else{
    const W=600,H=160,pad=28, mx=Math.max(...pts.map(p=>p.r))*1.15||1;
    const x=i=>pad+(W-2*pad)*i/(pts.length-1), y=v=>H-pad-(H-2*pad)*v/mx;
    const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.r).toFixed(1)).join(' ');
    const area=path+` L ${x(pts.length-1)} ${H-pad} L ${x(0)} ${H-pad} Z`;
    $('#spark').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${t('spark_aria')}">
      <path d="${area}" fill="var(--accent-bg)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.r)}" r="3.5" fill="var(--accent)"><title>${dDay(p.d)} · ${pctTxt(p.r)} · ${p.l} scanners</title></circle>`).join('')}
      <text x="${pad}" y="${H-8}" fill="var(--ink-faint)" font-family="JetBrains Mono,monospace" font-size="10">${dDay(pts[0].d)}</text>
      <text x="${W-pad}" y="${H-8}" text-anchor="end" fill="var(--ink-faint)" font-family="JetBrains Mono,monospace" font-size="10">${dDay(pts[pts.length-1].d)}</text>
      <text x="${pad}" y="14" fill="var(--ink-faint)" font-family="JetBrains Mono,monospace" font-size="10">${t('spark_lbl',pctTxt(Math.max(...pts.map(p=>p.r))))}</text></svg>`;
  }
  const op=$('#outPanel');
  if(prev&&D.out.length){ op.classList.remove('hidden'); $('#outList').innerHTML=D.out.map(([c,s])=>`<b>${esc(c)}</b> <span style="color:var(--ink-faint)">${esc(s||'')}</span>`).join(' &nbsp;·&nbsp; '); }
  else op.classList.add('hidden');
}

function renderAll(){ renderKpis(); renderSites(); renderAssets(); renderHist(); }

/* ---------- view persistence + shortcuts ---------- */
function saveView(){ try{ localStorage.setItem(LS_VIEW,JSON.stringify({F,sort,siteSort,hideZero:$('#hideZero').checked,sel:[...SEL],onlySel})); }catch(e){} }
function loadView(){ try{ const v=JSON.parse(localStorage.getItem(LS_VIEW)||'null'); if(!v) return;
  Object.keys(F).forEach(k=>{ if(v.F&&k in v.F) F[k]=Array.isArray(F[k])?(Array.isArray(v.F[k])?v.F[k]:[]):String(v.F[k]??''); });
  if(v.sort&&v.sort.k) sort=v.sort; if(Array.isArray(v.sel)) v.sel.forEach(c=>SEL.add(c)); onlySel=!!v.onlySel; if(v.siteSort) siteSort=v.siteSort; $('#hideZero').checked=!!v.hideZero; }catch(e){} }
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(), typing=tag==='input'||tag==='select'||tag==='textarea';
  if(e.key==='/'&&!typing&&D&&!document.querySelector('dialog[open]')){ e.preventDefault(); $('#fQ').focus(); $('#fQ').select(); }
  if(e.key==='Escape'&&typing&&e.target.type==='search'&&e.target.value){ e.preventDefault(); e.target.value=''; e.target.dispatchEvent(new Event('input')); }
});

/* ---------- backup (.json) ---------- */
const LS_BK='zsu.lastBackup', LS_DIRTY='zsu.dirty';
function markDirty(){ try{ localStorage.setItem(LS_DIRTY,'1'); }catch(e){} renderBackupState(); }
function renderBackupState(){
  let dirty=false; try{ dirty=localStorage.getItem(LS_DIRTY)==='1'; }catch(e){}
  $('#bkDot').classList.toggle('hidden',!dirty);
  $('#btnBackup').title=dirty?t('bk_pending'):'';
  let bk=null; try{ bk=localStorage.getItem(LS_BK); }catch(e){}
  $('#bkInfo').innerHTML=t('bk_info',loadHist().length,D?dDay(D.date):t('bk_none'),bk?new Date(bk).toLocaleString(LOC(),{dateStyle:'short',timeStyle:'short'}):t('bk_never'))+(dirty?`<br><span class="badge badge-warn">${t('bk_pending')}</span>`:'');
}
function exportBackup(){
  const hist=loadHist(); let last=null; try{ last=JSON.parse(localStorage.getItem(LS_LAST)||'null'); }catch(e){}
  if(!hist.length&&!last){ toast(t('t_bk_empty')); return; }
  const data={app:'zebra-usage',version:1,exportedAt:new Date().toISOString(),lang:LANG,history:hist,last};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const now=new Date(); const stamp=isoDay(now)+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
  const el=document.createElement('a'); el.href=URL.createObjectURL(blob); el.download=`zebra-usage_backup_${stamp}.json`; el.click(); setTimeout(()=>URL.revokeObjectURL(el.href),2000);
  try{ localStorage.setItem(LS_BK,now.toISOString()); localStorage.removeItem(LS_DIRTY); }catch(e){}
  renderBackupState(); toast(t('t_bk_saved',hist.length));
}
async function importBackup(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ data=null; }
  if(!data||data.app!=='zebra-usage'||!Array.isArray(data.history)){ toast(t('t_bk_bad')); return; }
  const cur=loadHist(), have=new Set(cur.map(h=>h.date));
  const valid=data.history.filter(h=>h&&typeof h.date==='string'&&typeof h.low==='number');
  const added=valid.filter(h=>!have.has(h.date));
  const merged=cur.concat(added).sort((a,b)=>a.date.localeCompare(b.date));
  while(merged.length>52) merged.shift();
  saveHist(merged);
  const imp=data.last&&data.last.texts?data.last:null;
  if(imp&&(!D||imp.date>D.date)){ try{ localStorage.setItem(LS_LAST,JSON.stringify(imp)); }catch(e){} build(imp,false); }
  else if(D){ build(D.raw,false); }
  renderBackupState();
  toast(t('t_bk_loaded',added.length,merged.length));
}
$('#btnBackup').onclick=()=>{ renderBackupState(); $('#dlgBackup').showModal(); };
$('#bkExport').onclick=exportBackup;
const jsonInput=$('#jsonInput');
$('#bkImport').onclick=()=>jsonInput.click();
$('#btnRestore').onclick=e=>{ e.stopPropagation(); jsonInput.click(); };
jsonInput.onchange=async()=>{ if(jsonInput.files[0]) await importBackup(jsonInput.files[0]); jsonInput.value=''; $('#dlgBackup').open&&renderBackupState(); };

/* ---------- drag & drop / pick ---------- */
const input=$('#fileInput');
$('#btnPick').onclick=e=>{ e.stopPropagation(); input.click(); };
$('#drop').onclick=()=>input.click();
$('#dropMini').onclick=()=>input.click();
input.onchange=()=>{ handleFiles(input.files); input.value=''; };
let dragN=0;
window.addEventListener('dragenter',e=>{ if(e.dataTransfer?.types?.includes('Files')){ dragN++; document.body.classList.add('dragging'); } });
window.addEventListener('dragleave',()=>{ dragN=Math.max(0,dragN-1); if(!dragN) document.body.classList.remove('dragging'); });
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{ e.preventDefault(); dragN=0; document.body.classList.remove('dragging'); handleFiles(e.dataTransfer.files); });
$('#statusPill').onclick=()=>input.click();

/* ---------- boot ---------- */
applyStatic(); renderStatus(); renderBackupState(); loadView();
(function boot(){
  try{ const r=JSON.parse(localStorage.getItem(LS_LAST)||'null'); if(r&&r.texts) build(r,false); }catch(e){}
})();
